<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140">
  <!-- Giemme Doors & Service — logo -->
  <g transform="translate(64 68)">
    <!-- anelli esterni -->
    <circle cx="0" cy="-2" r="55" fill="none" stroke="#1e3a5c" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="280 66" stroke-dashoffset="96"/>
    <circle cx="0" cy="-2" r="49" fill="none" stroke="#8a7a68" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="205 103" stroke-dashoffset="140" opacity="0.9"/>
    <!-- cornice ad arco -->
    <path d="M-22 32 V-17 A22 22 0 0 1 22 -17 V32 Z M-14 32 V-14.5 A14 14 0 0 1 14 -14.5 V32 Z" fill="#a28f79" fill-rule="evenodd" opacity="0.95"/>
    <!-- intern -->
    <path d="M-12.5 30 V-13 A12.5 12.5 0 0 1 12.5 -13 V30 Z" fill="#f7f4ef"/>
    <!-- porta aperta -->
    <g transform="rotate(-9 10 30)">
      <path d="M-10.8 30 V-10.5 A10.8 10.8 0 0 1 10.8 -10.5 V30 Z" fill="#1e3a5c"/>
      <rect x="5.6" y="1" width="1.8" height="9" rx="0.9" fill="#c4b5a0"/>
    </g>
    <!-- monogramma G -->
    <path d="M18 2 h5 v30 h-5 Z M18 2 h16 a4 4 0 0 1 4 4 v2 h-20 Z" fill="#a28f79" opacity="0.95"/>
  </g>
  <!-- wordmark -->
  <text x="150" y="66" font-family="Montserrat, Arial, sans-serif" font-size="33" font-weight="700" letter-spacing="3.5" fill="#1e3a5c">GIEMME</text>
  <text x="150" y="92" font-family="Montserrat, Arial, sans-serif" font-size="13.5" font-weight="600" letter-spacing="3.9" fill="#8a7a68">DOORS &amp; SERVICE</text>
  <text x="150" y="112" font-family="Montserrat, Arial, sans-serif" font-size="8.6" font-weight="500" letter-spacing="2" fill="#a9adb3">SOLUZIONI PER OGNI AMBIENTE</text>
</svg>
